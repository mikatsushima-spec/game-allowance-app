<!doctype html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#111827" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" href="./icon.svg" />
<title>ゲーム＆おこづかい管理</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#14213d;background:#f4f7fb;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-width:320px;min-height:100vh;background:linear-gradient(180deg,#eef5ff 0%,#f8fafc 34%,#f8fafc 100%)}button,input,select{font:inherit}button{-webkit-tap-highlight-color:transparent}.app-shell{width:min(100%,720px);margin:0 auto;padding:18px 14px 42px}.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:2px 4px 16px}.eyebrow{margin:0 0 2px;font-size:10px;font-weight:800;letter-spacing:.14em;color:#64748b}h1{margin:0;font-size:clamp(21px,5.6vw,30px);letter-spacing:-.04em;color:#0f172a}.storage-badge{flex:0 0 auto;padding:7px 9px;border:1px solid #dbe5f2;border-radius:999px;background:rgba(255,255,255,.8);font-size:11px;font-weight:700;color:#64748b}.card{margin:0 0 14px;padding:18px;border:1px solid #e1e8f0;border-radius:22px;background:rgba(255,255,255,.96);box-shadow:0 10px 28px rgba(15,23,42,.055)}.dashboard-card{border-color:#d6e4ff;background:linear-gradient(145deg,rgba(255,255,255,.98),rgba(241,247,255,.98))}.section-title-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.section-title-row>div{display:flex;align-items:center;gap:9px}h2{margin:0;font-size:20px;letter-spacing:-.03em}.step-badge{min-width:28px;height:28px;display:inline-grid;place-items:center;padding:0 8px;border-radius:10px;background:#111827;color:#fff;font-size:12px;font-weight:900}.muted{font-size:11px;color:#94a3b8;font-weight:700}.balance-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.balance-card{padding:14px;border:1px solid #e5eaf0;border-radius:17px;background:#fff}.balance-card h3{margin:0 0 9px;font-size:17px}.balance-value{font-size:17px;line-height:1.55;font-weight:900;letter-spacing:-.02em}.game-value{color:#265dcc}.money-value{color:#b76b00}.charts-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px}.mini-chart{min-width:0;padding:12px 11px 10px;border:1px solid #e6ebf1;border-radius:17px;background:#fff}.mini-chart-title{font-size:12px;font-weight:900;text-align:center;color:#475569}.bar-area{height:154px;display:flex;align-items:flex-end;justify-content:center;gap:18px;padding-top:30px}.bar-column{width:58px;text-align:center}.bar-value{height:30px;display:flex;align-items:flex-end;justify-content:center;font-size:10px;font-weight:800;color:#475569;white-space:nowrap}.bar-track{height:82px;width:36px;margin:4px auto 5px;display:flex;align-items:flex-end;border-radius:8px 8px 4px 4px;background:#eef2f7;overflow:hidden}.bar-fill{width:100%;border-radius:8px 8px 0 0;background:linear-gradient(180deg,#5b8def,#3567c8);transition:height .25s ease}.bar-label{font-size:11px;font-weight:800}.field{margin-top:16px}.field>label{display:block;margin:0 0 8px;font-size:13px;font-weight:900;color:#334155}.segmented{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;padding:4px;border-radius:14px;background:#eef2f7}.segmented button{min-height:42px;border:0;border-radius:11px;background:transparent;color:#64748b;font-weight:800;cursor:pointer}.segmented button.active{background:#fff;color:#0f172a;box-shadow:0 2px 8px rgba(15,23,42,.1)}.reward-segmented button.active:first-child{color:#245ac5}.reward-segmented button.active:last-child{color:#a86200}.date-input,.number-input,.minute-select{min-height:48px;border:1px solid #d9e1ea;border-radius:12px;background:#fff;color:#0f172a;font-weight:800;outline:none}.date-input{width:100%;padding:0 13px}.choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.choice-button{min-height:46px;padding:8px 9px;border:1px solid #dce4ee;border-radius:13px;background:#fff;color:#334155;font-size:12px;font-weight:800;line-height:1.25;cursor:pointer}.choice-button.selected{border-color:#3769d0;background:#eef4ff;color:#1e4fae;box-shadow:inset 0 0 0 1px #3769d0}.time-input-row,.money-input-wrap{display:flex;align-items:center;gap:8px}.number-input{width:76px;padding:0 11px;text-align:right}.minute-select{width:78px;padding:0 9px}.time-input-row span,.money-input-wrap span{font-size:13px;font-weight:800;color:#475569}.money-input{width:min(180px,65vw)}.preview-box{margin:16px 0 12px;padding:14px;border-radius:16px;background:#f4f8ff;border:1px solid #dbe7ff}.preview-box span,.preview-box small{display:block;color:#64748b;font-size:11px;font-weight:700}.preview-box strong{display:block;margin:3px 0;font-size:21px;color:#183b7a}.primary-button,.secondary-button{width:100%;min-height:52px;border:0;border-radius:15px;color:#fff;font-size:16px;font-weight:900;cursor:pointer}.primary-button{background:linear-gradient(135deg,#2e67d1,#1749ad);box-shadow:0 8px 18px rgba(40,94,203,.22)}.secondary-button{background:linear-gradient(135deg,#273449,#111827);box-shadow:0 8px 18px rgba(17,24,39,.17)}.result-message{margin-top:10px;padding:10px 12px;border-radius:12px;background:#ecfdf3;color:#167044;font-size:13px;font-weight:900;text-align:center}.use-result{background:#f8fafc;color:#334155}.history-list{display:grid;gap:8px}.history-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:9px;align-items:center;padding:11px 0;border-bottom:1px solid #edf1f5}.history-meta{margin-bottom:3px;font-size:10px;color:#94a3b8;font-weight:800}.history-description{font-size:12px;color:#334155;font-weight:800;line-height:1.35}.history-delta{font-size:12px;font-weight:900;white-space:nowrap}.positive{color:#176f46}.negative{color:#a63d3d}.undo-button{border:0;border-radius:9px;padding:7px 9px;background:#f1f5f9;color:#64748b;font-size:10px;font-weight:900;cursor:pointer}.empty-state{padding:22px 0 10px;text-align:center;color:#94a3b8;font-size:13px}.footer-note{padding:5px 8px 10px;text-align:center;font-size:10px;color:#94a3b8;font-weight:700}@media(min-width:620px){.app-shell{padding-top:28px}.card{padding:22px}.choice-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:380px){.storage-badge{display:none}.card{padding:15px}.balance-value{font-size:15px}.history-row{grid-template-columns:minmax(0,1fr) auto}.undo-button{grid-column:2}}.tools-card details{border:1px solid #e6ebf1;border-radius:14px;background:#fff}.tools-card summary{padding:13px 14px;cursor:pointer;font-size:13px;font-weight:900;color:#475569}.tools-inner{display:grid;gap:9px;padding:0 14px 14px}.tool-button{min-height:44px;border:1px solid #dce4ee;border-radius:12px;background:#fff;color:#334155;font-weight:900;cursor:pointer}.tool-note{margin:0;font-size:11px;line-height:1.5;color:#94a3b8}.hidden-file{display:none}</style>
</head>
<body>
<main class="app-shell">
<header class="topbar"><div><p class="eyebrow">GAME & ALLOWANCE</p><h1>ゲーム＆おこづかい管理</h1></div><div class="storage-badge">端末内保存</div></header>
<section class="card dashboard-card"><div class="section-title-row"><div><span class="step-badge">残高</span><h2>いま使える分</h2></div><span class="muted">自動集計</span></div><div id="balances" class="balance-grid"></div><div id="charts" class="charts-grid"></div></section>
<section class="card earn-card"><div class="section-title-row"><div><span class="step-badge">1</span><h2>貯める</h2></div><span class="muted">勉強・習い事</span></div><div class="field"><label>だれ？</label><div id="earnChild" class="segmented"></div></div><div class="field"><label>日付</label><input id="earnDate" class="date-input" type="date"></div><div class="field"><label>なにをした？</label><div id="categoryButtons" class="choice-grid"></div></div><div id="earnTimeField" class="field"><label>実際にやった時間</label><div class="time-input-row"><select id="studyHours" class="minute-select"><option value="0">0</option><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option></select><span>時間</span><select id="studyMinutes" class="minute-select"><option>0</option><option>15</option><option>30</option><option>45</option></select><span>分</span></div></div><div class="field"><label>どっちで貯める？</label><div id="earnReward" class="segmented reward-segmented"></div></div><div class="preview-box"><span>今回もらえる分</span><strong id="earnPreview">🎮 0分</strong><small id="earnPreviewNote">0分 → 自動計算</small></div><button id="earnBtn" class="primary-button" type="button">＋ 貯める</button><div id="earnMessage"></div></section>
<section class="card use-card"><div class="section-title-row"><div><span class="step-badge">2</span><h2>使う</h2></div><span class="muted">ゲーム・おこづかい</span></div><div class="field"><label>だれ？</label><div id="useChild" class="segmented"></div></div><div class="field"><label>日付</label><input id="useDate" class="date-input" type="date"></div><div class="field"><label>なにを使う？</label><div id="useReward" class="segmented reward-segmented"></div></div><div class="field"><label id="useAmountLabel">使ったゲーム時間</label><div id="gameUseInput" class="time-input-row"><select id="useHours" class="minute-select"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option></select><span>時間</span><select id="useMinutes" class="minute-select"><option>0</option><option>15</option><option>30</option><option>45</option></select><span>分</span></div><div id="moneyUseInput" class="money-input-wrap" style="display:none"><input id="useMoney" class="number-input money-input" inputmode="numeric" min="0" type="number" placeholder="300"><span>円</span></div></div><button id="useBtn" class="secondary-button" type="button">− 使う</button><div id="useMessage"></div></section>
<section class="card history-card"><div class="section-title-row"><div><span class="step-badge">履歴</span><h2>最近の記録</h2></div><span class="muted">間違えたら取消</span></div><div id="history"></div></section>
<section class="card tools-card"><div class="section-title-row"><div><span class="step-badge">保存</span><h2>データ管理</h2></div><span class="muted">必要なときだけ</span></div><details><summary>バックアップ／復元</summary><div class="tools-inner"><button id="exportBtn" class="tool-button" type="button">バックアップを書き出す</button><button id="importBtn" class="tool-button" type="button">バックアップから復元</button><input id="importFile" class="hidden-file" type="file" accept="application/json,.json"><p class="tool-note">端末のブラウザデータを消すと記録も消える可能性があります。ときどきバックアップしておくと安心です。</p><div id="backupMessage"></div></div></details></section>
<footer class="footer-note">ゲーム1時間分 ＝ おこづかい50円（15分＝15円） ・ データはこの端末だけに保存</footer>
</main>
<script>
const children=['たけき','ゆうき'];
const categories=['塾（平日授業）','塾（宿題）','塾（土日テスト）','塾（テスト復習）','公文（授業）','公文（宿題）','学校（宿題）','プログラミング教室','お手伝い'];
const fixed={'プログラミング教室':120,'お手伝い':15};
const mult={'塾（平日授業）':3,'塾（宿題）':3,'塾（土日テスト）':2,'塾（テスト復習）':3,'公文（授業）':3,'公文（宿題）':3,'学校（宿題）':3};
let entries=[];let state={earnChild:'たけき',useChild:'たけき',earnReward:'game',useReward:'game',category:'塾（平日授業）'};const $=id=>document.getElementById(id);const today=()=>new Date().toLocaleDateString('sv-SE');$('earnDate').value=today();$('useDate').value=today();
function fmtMin(m){const sign=m<0?'-':'';m=Math.abs(m);const h=Math.floor(m/60),mm=m%60;return sign+(h?`${h}時間${mm?mm+'分':''}`:`${mm}分`)}function fmtDate(s){const d=new Date(s+'T00:00:00');return `${d.getMonth()+1}/${d.getDate()}`}function moneyFromMinutes(m){m=Math.max(0,Math.round(m));const h=Math.floor(m/60),r=m%60;const q={0:0,15:15,30:25,45:40};return h*50+(q[r]??Math.ceil((r/60*50)/5)*5)}function calcRewardMinutes(){if(fixed[state.category]!=null)return fixed[state.category];return (Number($('studyHours').value)*60+Number($('studyMinutes').value))*mult[state.category]}
function balances(){const b=Object.fromEntries(children.map(c=>[c,{game:0,money:0}]));for(const e of entries)b[e.child][e.reward]+=e.delta;return b}function renderSegment(id,items,active,onClick){$(id).innerHTML=items.map(x=>`<button type="button" class="${x.value===active?'active':''}" data-value="${x.value}">${x.label}</button>`).join('');$(id).querySelectorAll('button').forEach(b=>b.onclick=()=>onClick(b.dataset.value))}function rewardItems(){return[{value:'game',label:'🎮 ゲーム時間'},{value:'money',label:'💰 おこづかい'}]}
function renderControls(){renderSegment('earnChild',children.map(x=>({value:x,label:x})),state.earnChild,v=>{state.earnChild=v;renderControls()});renderSegment('useChild',children.map(x=>({value:x,label:x})),state.useChild,v=>{state.useChild=v;renderControls()});renderSegment('earnReward',rewardItems(),state.earnReward,v=>{state.earnReward=v;renderControls();updatePreview()});renderSegment('useReward',rewardItems(),state.useReward,v=>{state.useReward=v;renderControls();renderUseInput()});$('categoryButtons').innerHTML=categories.map(c=>`<button type="button" class="choice-button ${c===state.category?'selected':''}" data-category="${c}">${c}</button>`).join('');$('categoryButtons').querySelectorAll('button').forEach(b=>b.onclick=()=>{state.category=b.dataset.category;renderControls();updatePreview()});$('earnTimeField').style.display=fixed[state.category]!=null?'none':'block'}function renderUseInput(){const game=state.useReward==='game';$('gameUseInput').style.display=game?'flex':'none';$('moneyUseInput').style.display=game?'none':'flex';$('useAmountLabel').textContent=game?'使ったゲーム時間':'使ったおこづかい'}
function updatePreview(){const m=calcRewardMinutes();if(state.earnReward==='game'){$('earnPreview').textContent=`🎮 ${fmtMin(m)}`;$('earnPreviewNote').textContent=fixed[state.category]!=null?`${state.category} → 固定`:`実時間 × ${mult[state.category]}`}else{const y=moneyFromMinutes(m);$('earnPreview').textContent=`💰 ${y.toLocaleString()}円`;$('earnPreviewNote').textContent=`${fmtMin(m)}分相当 → ${y.toLocaleString()}円`}}
function renderDashboard(){const b=balances();$('balances').innerHTML=children.map(c=>`<div class="balance-card"><h3>${c}</h3><div class="balance-value game-value">🎮 ${fmtMin(b[c].game)}</div><div class="balance-value money-value">💰 ${b[c].money.toLocaleString()}円</div></div>`).join('');const maxGame=Math.max(60,...children.map(c=>Math.max(0,b[c].game)));const maxMoney=Math.max(100,...children.map(c=>Math.max(0,b[c].money)));$('charts').innerHTML=`<div class="mini-chart"><div class="mini-chart-title">ゲーム時間</div><div class="bar-area">${children.map(c=>barHtml(c,b[c].game,maxGame,'game')).join('')}</div></div><div class="mini-chart"><div class="mini-chart-title">おこづかい</div><div class="bar-area">${children.map(c=>barHtml(c,b[c].money,maxMoney,'money')).join('')}</div></div>`}function barHtml(c,v,max,type){const positive=Math.max(0,v);const h=Math.max(0,Math.min(100,positive/max*100));const label=type==='game'?fmtMin(v):`${v.toLocaleString()}円`;return `<div class="bar-column"><div class="bar-value">${label}</div><div class="bar-track"><div class="bar-fill" style="height:${h}%"></div></div><div class="bar-label">${c}</div></div>`}
function renderHistory(){if(!entries.length){$('history').innerHTML='<div class="empty-state">まだ記録がありません</div>';return}$('history').innerHTML=`<div class="history-list">${[...entries].reverse().slice(0,20).map(e=>{const delta=e.reward==='game'?`${e.delta>0?'+':''}${fmtMin(e.delta)}`:`${e.delta>0?'+':''}${e.delta.toLocaleString()}円`;return `<div class="history-row"><div><div class="history-meta">${fmtDate(e.date)} ・ ${e.child}</div><div class="history-description">${e.description}</div></div><div class="history-delta ${e.delta>=0?'positive':'negative'}">${delta}</div><button class="undo-button" data-id="${e.id}" type="button">取消</button></div>`}).join('')}</div>`;$('history').querySelectorAll('.undo-button').forEach(b=>b.onclick=async()=>{entries=entries.filter(e=>e.id!==b.dataset.id);await storage.save(entries);renderAll()})}
function renderAll(){renderDashboard();renderHistory();updatePreview();renderUseInput()}
$('studyHours').onchange=updatePreview;$('studyMinutes').onchange=updatePreview;$('earnBtn').onclick=async()=>{const m=calcRewardMinutes();if(m<=0){$('earnMessage').innerHTML='<div class="result-message">時間を入力してください</div>';return}const delta=state.earnReward==='game'?m:moneyFromMinutes(m);const actual=fixed[state.category]!=null?'固定':fmtMin(Number($('studyHours').value)*60+Number($('studyMinutes').value));entries.push({id:crypto.randomUUID(),date:$('earnDate').value,child:state.earnChild,reward:state.earnReward,delta,description:`${state.category}（実時間 ${actual}）`});await storage.save(entries);$('earnMessage').innerHTML='<div class="result-message">貯めました ✓</div>';renderAll()};$('useBtn').onclick=async()=>{let amount;if(state.useReward==='game')amount=Number($('useHours').value)*60+Number($('useMinutes').value);else amount=Number($('useMoney').value);if(!amount||amount<=0){$('useMessage').innerHTML='<div class="result-message use-result">使った量を入力してください</div>';return}entries.push({id:crypto.randomUUID(),date:$('useDate').value,child:state.useChild,reward:state.useReward,delta:-amount,description:state.useReward==='game'?`ゲームを${fmtMin(amount)}使った`:`おこづかいを${amount.toLocaleString()}円使った`});await storage.save(entries);$('useMessage').innerHTML='<div class="result-message use-result">記録しました ✓</div>';$('useHours').value='0';$('useMinutes').value='0';$('useMoney').value='';renderAll()};
const storage={db:null,async init(){try{this.db=await new Promise((res,rej)=>{const r=indexedDB.open('game-allowance-db',1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('state'))r.result.createObjectStore('state')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});const d=await this.idbGet();if(Array.isArray(d))return d}catch(e){}try{return JSON.parse(localStorage.getItem('game-allowance-entries')||'[]')}catch(e){return[]}},idbGet(){return new Promise((res,rej)=>{const tx=this.db.transaction('state','readonly');const r=tx.objectStore('state').get('entries');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},async save(data){try{if(this.db)await new Promise((res,rej)=>{const tx=this.db.transaction('state','readwrite');tx.objectStore('state').put(data,'entries');tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}catch(e){}try{localStorage.setItem('game-allowance-entries',JSON.stringify(data))}catch(e){}}};
$('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),entries},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`game-allowance-backup-${today()}.json`;a.click();URL.revokeObjectURL(a.href);$('backupMessage').innerHTML='<div class="result-message">バックアップを書き出しました</div>'};$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;try{const d=JSON.parse(await f.text());if(!Array.isArray(d.entries))throw 0;entries=d.entries;await storage.save(entries);renderAll();$('backupMessage').innerHTML='<div class="result-message">復元しました ✓</div>'}catch(err){$('backupMessage').innerHTML='<div class="result-message use-result">このファイルは復元できません</div>'}e.target.value=''};
(async()=>{entries=await storage.init();renderControls();renderAll()})();
</script>
<script src="./axis-charts.js?v=2"></script>
<script src="./daily-limit.js"></script>
<script>if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js'));</script>
</body></html>
